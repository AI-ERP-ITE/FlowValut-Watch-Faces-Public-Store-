name: FlowVault frozen Firebase release promotion

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options: [RUN_REVIEW, CREATE_PREVIEW, SYNC_TO_LIVE]
      sync_id: { required: true, type: string }
      release_uri: { required: true, type: string }
      release_sha256: { required: true, type: string }
      policy_hash: { required: true, type: string }
      paddle_live_client_token: { required: false, type: string }
      preview_channel: { required: false, type: string }

permissions:
  contents: none
  id-token: write

concurrency:
  group: flowvault-production-promotion-${{ inputs.sync_id }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLOWVAULT_SYNC_ID: ${{ inputs.sync_id }}
      FLOWVAULT_RELEASE_URI: ${{ inputs.release_uri }}
      FLOWVAULT_RELEASE_SHA256: ${{ inputs.release_sha256 }}
      FLOWVAULT_POLICY_HASH: ${{ inputs.policy_hash }}
      FLOWVAULT_PADDLE_LIVE_CLIENT_TOKEN: ${{ inputs.paddle_live_client_token }}
    steps:
      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/63546256310/locations/global/workloadIdentityPools/github-flowvault/providers/github
          service_account: flowvault-deploy-runner@zeppfaceloader-b0b106e9.iam.gserviceaccount.com

      - name: Retrieve the accepted Firebase staging release
        shell: bash
        run: |
          set -euo pipefail
          case "$FLOWVAULT_RELEASE_URI" in
            gs://flowvault-staging-2026.firebasestorage.app/flowvault-releases/*) ;;
            *) echo "Untrusted release URI"; exit 1 ;;
          esac
          mkdir -p frozen
          gcloud storage cp "$FLOWVAULT_RELEASE_URI" frozen/release.tgz
          echo "$FLOWVAULT_RELEASE_SHA256  frozen/release.tgz" | sha256sum --check --strict
          mkdir -p frozen/content
          tar -xzf frozen/release.tgz -C frozen/content
          node frozen/content/frozenReleaseRunner.mjs --action=VERIFY --package-root=frozen/content

      - name: Install deployment runtime only
        shell: bash
        run: npm ci --omit=dev --prefix frozen/content/backend/storefront

      - name: Materialize fixed production bindings
        if: inputs.action == 'RUN_REVIEW' || inputs.action == 'CREATE_PREVIEW'
        shell: bash
        run: |
          node frozen/content/frozenReleaseRunner.mjs --action=MATERIALIZE_PRODUCTION_HOSTING --package-root=frozen/content --output=frozen/content/firebase/.production-hosting
          node frozen/content/frozenReleaseRunner.mjs --action=MATERIALIZE_PRODUCTION_BACKEND --package-root=frozen/content

      - name: Verify frozen release and production readiness
        if: inputs.action == 'RUN_REVIEW'
        shell: bash
        run: node frozen/content/reportPromotionRunner.mjs --action=RUN_REVIEW --sync-id=${{ inputs.sync_id }}

      - name: Create isolated production preview
        if: inputs.action == 'CREATE_PREVIEW'
        id: preview
        working-directory: frozen/content/firebase
        shell: bash
        run: |
          CHANNEL_ID="fv-${{ inputs.sync_id }}"
          CHANNEL_ID="${CHANNEL_ID:0:38}"
          OUTPUT="$(npx -y firebase-tools@latest hosting:channel:deploy "$CHANNEL_ID" --project zeppfaceloader-b0b106e9 --config firebase.production.json --expires 7d --non-interactive)"
          PREVIEW_URL="$(printf '%s' "$OUTPUT" | grep -oE 'https://zeppfaceloader-b0b106e9--[a-z0-9-]+\.web\.app' | tail -1)"
          test -n "$PREVIEW_URL"
          echo "channel=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Record production preview
        if: inputs.action == 'CREATE_PREVIEW'
        run: node frozen/content/reportPromotionRunner.mjs --action=CREATE_PREVIEW --sync-id=${{ inputs.sync_id }} --preview-channel=${{ steps.preview.outputs.channel }} --preview-url=${{ steps.preview.outputs.url }}

      - name: Deploy the accepted storefront backend package
        if: inputs.action == 'SYNC_TO_LIVE'
        working-directory: frozen/content/firebase
        shell: bash
        run: |
          node ../frozenReleaseRunner.mjs --action=MATERIALIZE_PRODUCTION_BACKEND --package-root=..
          npx -y firebase-tools@latest deploy --only functions:storefront --project zeppfaceloader-b0b106e9 --config firebase.storefront.production.json --non-interactive

      - name: Promote accepted preview Hosting
        if: inputs.action == 'SYNC_TO_LIVE'
        shell: bash
        run: npx -y firebase-tools@latest hosting:clone zeppfaceloader-b0b106e9:${{ inputs.preview_channel }} zeppfaceloader-b0b106e9:live --non-interactive

      - name: Record completed production synchronization
        if: inputs.action == 'SYNC_TO_LIVE'
        run: node frozen/content/reportPromotionRunner.mjs --action=SYNC_TO_LIVE --sync-id=${{ inputs.sync_id }} --preview-channel=${{ inputs.preview_channel }}

