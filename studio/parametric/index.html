    <script>
      // GitHub Pages SPA deep-link restore.
      // 404.html redirects deep routes to /?p=/deep/path — this script restores the
      // original path via history.replaceState BEFORE React Router initialises,
      // so all deep links (/admin, /studio/lab, etc.) resolve correctly.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          window.history.replaceState(
            null, null,
            window.location.pathname.replace(/\/$/, '') + p +
            (q ? '?' + q.replace(/~and~/g, '&') : '') +
            window.location.hash
          );
        }
      })();
    </script>
